function normalizeFirebaseData(raw){
  if(!raw) return fallbackData;
  const data = JSON.parse(JSON.stringify(fallbackData));
  if(raw.settings) data.settings = {...data.settings,...raw.settings};
  if(raw.categories) data.categories = Array.isArray(raw.categories) ? raw.categories : Object.entries(raw.categories).map(([id,v])=>({id,...v}));
  if(raw.products) data.products = Array.isArray(raw.products) ? raw.products : Object.entries(raw.products).map(([id,v])=>({id,...v}));
  return data;
}

    renderAll();
    return;
  }
  try{
    const {initializeApp} = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js");
    const {getDatabase, ref, get} = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js");
    const firebaseApp = initializeApp(firebaseConfig);
    const db = getDatabase(firebaseApp);
    const snapshot = await get(ref(db, "/"));
    appData = normalizeFirebaseData(snapshot.val());
    deliveryFee = Number(appData.settings.deliveryFee || 0);
    renderAll();
  }catch(error){
    console.error(error);
    appData = fallbackData;
    deliveryFee = Number(appData.settings.deliveryFee || 0);
    renderAll();
    alert("تعذر تحميل البيانات من Firebase. تم تشغيل النسخة التجريبية.");
  }
}

function renderAll(){
  const s = appData.settings || {};
  $("restaurant-name").textContent = s.restaurantName || "Tasty Fast Food";
  $("restaurant-tagline").textContent = s.tagline || "";
  $("restaurant-address").textContent = s.address || "";
  $("restaurant-phone").textContent = s.phone || "";
  $("restaurant-logo").src = s.logo || "images/logo.png";
  $("delivery-price").textContent = money(deliveryFee);
  renderCategories();
}

function renderCategories(){
  const cats = [...(appData.categories || [])].sort((a,b)=>(a.sort||0)-(b.sort||0));
  const nav = $("categories");
  const root = $("menu-root");
  nav.innerHTML = "";
  root.innerHTML = "";
  cats.forEach((cat,index)=>{
    const btn = document.createElement("button");
    btn.className = "category-btn" + (index===0 ? " active" : "");
    btn.dataset.category = cat.id;
    btn.textContent = cat.name || cat.title || cat.id;
    nav.appendChild(btn);

    const section = document.createElement("section");
    section.className = "menu-container" + (index===0 ? " active" : "");
    section.id = `${cat.id}-menu`;
    section.innerHTML = `<h2 class="section-title">${cat.title || cat.name || ""}</h2><div class="menu-items"></div>`;
    root.appendChild(section);
    renderProducts(cat.id, section.querySelector(".menu-items"));
  });
  nav.querySelectorAll(".category-btn").forEach(btn=>{
    btn.addEventListener("click",()=>{
      nav.querySelectorAll(".category-btn").forEach(b=>b.classList.remove("active"));
      root.querySelectorAll(".menu-container").forEach(c=>c.classList.remove("active"));
      btn.classList.add("active");
      $(`${btn.dataset.category}-menu`)?.classList.add("active");
    });
  });
}

function renderProducts(category, container){
  const products = (appData.products || []).filter(p=>p.category===category && p.active!==false);
  if(!products.length){
    container.innerHTML = `<div class="loading">لا توجد منتجات حالياً</div>`;
    return;
  }
  products.forEach(item=>{
    const card = document.createElement("div");
    card.className = "menu-item";
    card.innerHTML = `
      <div class="item-image-container"><img src="${item.image || "images/logo.png"}" alt="${escapeHtml(item.name)}" class="item-image" loading="lazy" onerror="this.src='images/logo.png'"></div>
      <div class="item-details">
        <div class="item-name">${escapeHtml(item.name)}</div>
        <div class="item-description">${escapeHtml(item.description || "")}</div>
        <div class="item-price">${money(item.price)}</div>
        <button class="add-to-cart" data-id="${item.id}"><i class="fas fa-cart-plus"></i> إضافة للسلة</button>
      </div>`;
    container.appendChild(card);
  });
}

function escapeHtml(text){
  return String(text).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
}

function updateCart(){
  const box = $("cart-items");
  box.innerHTML = "";
  let total = 0;
  cart.forEach((item,index)=>{
    total += item.price * item.quantity;
    const row = document.createElement("div");
    row.className = "cart-item";
    row.innerHTML = `
      <div class="cart-item-name">${escapeHtml(item.name)}</div>
      <div class="cart-item-price">${money(item.price)}</div>
      <div class="cart-item-quantity">
        <button class="quantity-btn decrease" data-index="${index}">-</button>
        <span class="quantity-value">${item.quantity}</span>
        <button class="quantity-btn increase" data-index="${index}">+</button>
      </div>
      <button class="remove-item" data-index="${index}"><i class="fas fa-trash"></i></button>`;
    box.appendChild(row);
  });
  const count = cart.reduce((sum,i)=>sum+i.quantity,0);
  $("cart-count").textContent = count;
  $("cart-count").style.display = count ? "flex" : "none";
  $("total-price").textContent = money(total);
  $("delivery-price").textContent = money(deliveryFee);
  $("total-with-delivery").textContent = money(total + deliveryFee);
}

function openCart(){$("cart-container").classList.add("open")}
function closeCart(){$("cart-container").classList.remove("open")}

document.addEventListener("click",e=>{
  const add = e.target.closest(".add-to-cart");
  if(add){
    const product = (appData.products||[]).find(p=>String(p.id)===String(add.dataset.id));
    if(!product) return;
    const existing = cart.find(i=>String(i.id)===String(product.id));
    if(existing) existing.quantity++;
    else cart.push({id:product.id,name:product.name,price:Number(product.price),quantity:1});
    updateCart();
  }
  const inc=e.target.closest(".increase"), dec=e.target.closest(".decrease"), rem=e.target.closest(".remove-item");
  if(inc){cart[Number(inc.dataset.index)].quantity++;updateCart()}
  if(dec){const i=Number(dec.dataset.index);if(cart[i].quantity>1)cart[i].quantity--;updateCart()}
  if(rem){cart.splice(Number(rem.dataset.index),1);updateCart()}
});

$("cart-btn").addEventListener("click",openCart);
$("close-cart").addEventListener("click",closeCart);
$("checkout-btn").addEventListener("click",()=>{
  if(!cart.length){alert("السلة فارغة، الرجاء إضافة عناصر أولاً");return}
  $("checkout-modal").classList.add("open");
});
$("close-modal").addEventListener("click",()=>$("checkout-modal").classList.remove("open"));
$("checkout-modal").addEventListener("click",e=>{if(e.target.id==="checkout-modal")$("checkout-modal").classList.remove("open")});

$("customer-form").addEventListener("submit",e=>{
  e.preventDefault();
  const s=appData.settings||{};
  const name=$("customer-name").value.trim();
  const address=$("customer-address").value.trim();
  const phone=$("customer-phone").value.trim();
  const notes=$("cart-notes").value.trim();
  const total=cart.reduce((sum,i)=>sum+i.price*i.quantity,0);
  let message=`🍔 *طلب جديد من ${s.restaurantName||"Tasty Fast Food"}* 🍕\n\n`;
  message+=`👤 *الاسم:* ${name}\n📍 *العنوان:* ${address}\n📞 *رقم الهاتف:* ${phone}\n\n📋 *تفاصيل الطلب:*\n`;
  cart.forEach(i=>message+=`- ${i.name} (${i.quantity} × ${i.price}) = ${i.quantity*i.price} دينار\n`);
  message+=`\n💰 *المجموع:* ${total} دينار\n🚚 *رسوم التوصيل:* ${deliveryFee} دينار\n💵 *المجموع الكلي:* ${total+deliveryFee} دينار`;
  if(notes)message+=`\n\n📝 *ملاحظات:* ${notes}`;
  const whatsapp=String(s.whatsapp||"9647701236363").replace(/\D/g,"");
  window.open(`https://wa.me/${whatsapp}?text=${encodeURIComponent(message)}`,"_blank");
  cart=[];updateCart();closeCart();$("checkout-modal").classList.remove("open");$("customer-form").reset();$("cart-notes").value="";
});

loadData();
</script>
</body>
</html>
